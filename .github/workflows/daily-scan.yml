name: Daily Job Scan

on:
  schedule:
    # GitHub's schedule trigger is unreliable - confirmed (2026-08-27, -28,
    # -31) to skip an entire morning/midday block of firings some days, only
    # actually running that evening. So this window now spans the whole day,
    # 08:37-22:41 Israel, instead of stopping at early afternoon. scan.py
    # exits immediately once any attempt succeeds that day, so later firings
    # are cheap no-ops. The notification (RemoteTrigger, separate from this
    # file) checks the *next* morning at 07:00 rather than same-day, so it
    # reports on results that have had this whole window to land. Times are
    # Israel local + 3h (IDT/summer) in UTC; deliberately non-round minutes.
    - cron: '37 5 * * *'   # ~08:37 Israel
    - cron: '41 7 * * *'   # ~10:41 Israel
    - cron: '43 9 * * *'   # ~12:43 Israel
    - cron: '47 11 * * *'  # ~14:47 Israel
    - cron: '53 13 * * *'  # ~16:53 Israel
    - cron: '59 15 * * *'  # ~18:59 Israel
    - cron: '11 18 * * *'  # ~21:11 Israel
    - cron: '41 19 * * *'  # ~22:41 Israel
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-job-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job scan
        id: scan
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scan.py

      - name: Commit and push updated results
        run: |
          git config user.name "job-scanner-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json latest_results.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily job scan: $(date -u +%Y-%m-%d)"
            git push || (git pull --rebase && git push)
          fi
