name: Daily Job Scan

on:
  schedule:
    # GitHub's schedule trigger is unreliable (has silently skipped entire
    # days, and drifted by 3+ hours) - so this retries several times through
    # the morning/early afternoon instead of relying on one fixed time.
    # scan.py exits immediately once any attempt succeeds that day, so later
    # firings are no-ops. Times are Israel local + 3h (IDT/summer) in UTC;
    # deliberately non-round minutes.
    - cron: '37 5 * * *'   # ~08:37 Israel
    - cron: '41 7 * * *'   # ~10:41 Israel
    - cron: '43 9 * * *'   # ~12:43 Israel
    - cron: '47 10 * * *'  # ~13:47 Israel
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-job-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job scan
        id: scan
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scan.py

      - name: Commit and push updated results
        run: |
          git config user.name "job-scanner-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json latest_results.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily job scan: $(date -u +%Y-%m-%d)"
            git push || (git pull --rebase && git push)
          fi
