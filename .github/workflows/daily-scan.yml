name: Daily Job Scan

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-job-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job scan
        id: scan
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scan.py

      - name: Commit and push updated results
        run: |
          git config user.name "job-scanner-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json latest_results.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily job scan: $(date -u +%Y-%m-%d)"
            git push || (git pull --rebase && git push)
          fi

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: nimrodbaum@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.scan.outputs.subject }}
          to: nimrodbaum@gmail.com
          from: Daily Job Scraper <nimrodbaum@gmail.com>
          html_body: file://email_body.html
          
